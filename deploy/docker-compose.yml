# Vitrine estatica, com o site dentro da imagem da esteira. Nao ha API aqui: o botao Apoiar aponta para a
# pagina unica em firawynix.com.br/apoie, que ja concentra os apoios de todos os sites.
services:
  site:
    mem_limit: 128m   # teto por capacidade (02/10/2026; docs/guias/LIMITES-E-SAUDE.md)
    # Imagem da esteira, com o conteúdo dentro. Quem fixa o digest assinado é o override do firaw-deploy
    # (docker-compose.override.yml -> /etc/firaw-deploy/override/firawselector-mock.yml); sem ele, nada sobe.
    image: ghcr.io/firawynix/firawselector-mock:latest
    container_name: firawselector-mock
    restart: unless-stopped
    ports:
      # so o tunel alcanca: nada de 0.0.0.0, senao o site fica exposto na LAN
      # por cima da Cloudflare.
      - "127.0.0.1:${PORTA_SITE:-26003}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
